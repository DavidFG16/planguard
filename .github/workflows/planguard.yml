# PlanGuard: reviews the Terraform plan of every pull request.
# terraform plan (read-only OIDC role) -> deterministic risk rules + Claude
# explanation -> one sticky PR comment -> the check fails on critical risk.
name: planguard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No `paths:` filter on purpose: a REQUIRED check that a path filter skips
    # stays "Pending" forever and blocks the merge.

permissions:
  contents: read
  id-token: write      # lets the job request an OIDC token to assume the AWS role
  pull-requests: write # lets the job create/update the PlanGuard comment

concurrency:
  group: planguard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  planguard:
    name: planguard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` on this job: it would change the OIDC `sub` claim
    # that the AWS trust policy expects.
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The reviewer runs from the BASE branch: a pull request cannot change the
      # code that judges it, or the code that receives the Anthropic API key.
      - name: Checkout PlanGuard from the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .planguard-base
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only role via OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: planguard-pr-${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Terraform init
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          SANDBOX_ACCOUNT_ID: ${{ secrets.SANDBOX_ACCOUNT_ID }}
        run: |
          printf 'bucket = "%s"\nallowed_account_ids = ["%s"]\n' "$TF_STATE_BUCKET" "$SANDBOX_ACCOUNT_ID" > backend.hcl
          terraform init -input=false -backend-config=backend.hcl

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_sandbox_account_id: ${{ secrets.SANDBOX_ACCOUNT_ID }}
        run: |
          # -lock=false: the CI role is read-only and cannot write the S3 lock file.
          terraform plan -input=false -lock=false -no-color -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Runs from .planguard-base, so `python -m planguard` imports the base
      # branch's package, never the copy inside the pull request.
      - name: PlanGuard review
        id: review
        working-directory: .planguard-base
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # only this step gets it
          SANDBOX_ACCOUNT_ID: ${{ secrets.SANDBOX_ACCOUNT_ID }} # to scrub it from the comment
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          if [ -f planguard/__main__.py ]; then
            python -m pip install --quiet --disable-pip-version-check -r planguard/requirements.txt \
              && python -m planguard ../infra/plan.json --out ../comment.md
            code=$?
          else
            # Transition only: the base branch does not have the reviewer yet.
            scripts/summarize-plan.sh ../infra/plan.json > ../comment.md
            code=$?
          fi
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Post or update the PR comment
        if: ${{ !cancelled() && hashFiles('comment.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .planguard-base/scripts/upsert-pr-comment.sh comment.md

      # 0 = low/medium/high (pass), 2 = critical (merge blocked), anything else =
      # PlanGuard failed, which also blocks (fail closed).
      - name: Risk gate
        if: ${{ !cancelled() }}
        env:
          EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          case "${EXIT_CODE:-missing}" in
            0) echo "PlanGuard: no critical risk." ;;
            2) echo "::error title=PlanGuard::Critical risk, merge blocked. See the PlanGuard comment on the pull request."
               exit 1 ;;
            *) echo "::error title=PlanGuard::PlanGuard did not finish (exit code: ${EXIT_CODE:-missing})."
               exit 1 ;;
          esac
